name: Docker Hub Pull Metrics

on:
  schedule:
    # 02:17 UTC every day (avoid the top of the hour, when GH queues are busy)
    - cron: '17 2 * * *'
  workflow_dispatch:

concurrency:
  group: dockerhub-metrics
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: metrics/go.mod
          cache: false

      - name: Collect pull counts and render charts
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          REPOS: fileserver gitweb wechat
        run: |
          (cd metrics && go build -o "$RUNNER_TEMP/collect" ./cmd/collect)
          (cd metrics && go build -o "$RUNNER_TEMP/plot" ./cmd/plot)
          "$RUNNER_TEMP/collect"
          "$RUNNER_TEMP/plot"

      - name: Commit data and charts
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics/data docs
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(metrics): update Docker Hub pull counts [skip ci]"
          git push
